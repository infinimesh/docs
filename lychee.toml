# Link check. Local hosts and example domains are skipped.
exclude = [
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "nip\\.io",
  "infinimesh\\.local",
  "example\\.(com|org)",
  "^mqtts?://",
]
exclude_path = [".git"]
max_retries = 2
timeout = 20
accept = ["200..=299", "403", "429"]
include_fragments = false
